[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "versline"
version = "0.1.3"
description = "Miroverse Toolkit, CLI and Library for Media Transcription, Document Translation, and Question Generation using LLMs."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Miroverse Solutions", email = "info@miroverse.ir"}
]
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
    "openai>=1.0.0",
    "google-genai>=1.45.0",
     "httpx>=0.28.1",
    "httpx[socks]>=0.28.1",
    "python-dotenv>=1.2.2",
    "ffmpeg-python>=0.2.0",
    "markitdown>=0.0.1",
    "genanki>=0.13.0",
    "rich>=13.7.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "pdfplumber>=0.10.0",
    "tqdm>=4.66.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "beautifulsoup4>=4.12.0",
    "qdrant-client>=1.17.1",
    "fastembed>=0.8.0",
    "FlagEmbedding>=1.3.3",
    "transformers<5",
    "sentence-transformers>=3.0.0",
    "langchain>=1.2.14",
    "langchain-core>=1.2.23",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.12",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.1",
    "tavily-python>=0.7.23",
    "cohere>=5.21.1",
    "optimum[openvino]>=1.17.0",
]

[project.scripts]
versline = "versline.cli:app"

[tool.setuptools.package-data]
versline = ["resources/prompts/*.md", "resources/assets/*"]

[tool.setuptools.packages.find]
where = ["src"]
