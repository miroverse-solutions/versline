[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "versline"
version = "0.1.2"
description = "Miroverse Toolkit, CLI and Library for Media Transcription, Document Translation, and Question Generation using LLMs."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Miroverse Solutions", email = "info@miroverse.ir"}
]
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
    "openai>=1.0.0",
    "google-genai>=1.45.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "ffmpeg-python>=0.2.0",
    "markitdown>=0.0.1",
    "genanki>=0.13.0",
    "rich>=13.7.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "pdfplumber>=0.10.0",
    "tqdm>=4.66.0",
    "pandas>=2.2.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
versline = "versline.cli:app"

[tool.setuptools.package-data]
versline = ["resources/prompts/*.md"]

[tool.setuptools.packages.find]
where = ["src"]
