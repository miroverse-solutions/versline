[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "versline"
version = "1.0.0"
description = "Miroverse Toolkit, CLI and Library for Media Transcription, Document Translation, and Question Generation using LLMs."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Miroverse Solutions", email = "info@miroverse.ir"}
]
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
    "openai>=1.0.0",
    "google-genai>=1.45.0",
     "httpx>=0.28.1",
    "httpx[socks]>=0.28.1",
    "python-dotenv>=1.2.2",
    "static-ffmpeg>=2.7",
    "markitdown>=0.0.1",
    "genanki>=0.13.0",
    "rich>=13.7.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "pdfplumber>=0.10.0",
    "pymupdf>=1.24.0",
    "tqdm>=4.66.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "beautifulsoup4>=4.12.0",
    "mcp>=1.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
versline = "versline.cli:app"

[tool.setuptools.package-data]
versline = ["resources/prompts/*.md", "resources/assets/*"]

[tool.setuptools.packages.find]
where = ["src"]
