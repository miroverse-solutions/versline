name: Manual Draft Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0). Leave empty to use version from pyproject.toml'
        required: false
        type: string
      publish:
        description: 'Publish immediately (needed so friends get the "new version" notice). Unchecked = draft'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests -q

  draft-release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # 3.11 includes tomllib natively

      - name: Determine Release Version
        shell: python
        run: |
          import os
          import tomllib
          import sys

          # Try to get input version, handle if it's not provided
          input_version = "${{ inputs.version }}"
          
          if input_version:
              version = input_version
          else:
              print("No input version provided. Reading from pyproject.toml...")
              try:
                  with open("pyproject.toml", "rb") as f:
                      data = tomllib.load(f)
                      # PEP 621 Standard: project.version
                      version_val = data.get("project", {}).get("version")
                      
                      if not version_val:
                          print("::error::Could not find 'version' in [project] table of pyproject.toml")
                          sys.exit(1)
                      
                      version = f"v{version_val}"
              except Exception as e:
                  print(f"::error::Error parsing pyproject.toml: {e}")
                  sys.exit(1)
          
          print(f"Selected Version: {version}")
          
          # Write to GITHUB_ENV so subsequent steps can use it
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"RELEASE_VERSION={version}\n")

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Remove existing release and tag if exists
        # This step ensures we can re-run a draft release for the same version tag
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          delete_release: true
          tag_name: ${{ env.RELEASE_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: Versline ${{ env.RELEASE_VERSION }}
          draft: ${{ !inputs.publish }}
          prerelease: false
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.whl
            dist/*.tar.gz
